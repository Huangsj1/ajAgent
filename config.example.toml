# Copy to config.local.toml and fill in credentials locally.
# RAG is optional; Qwen retrieval models run locally.

[runtime]
context_tokens = 32000
output_tokens = 4096
memory = true
provider = "deepseek"
workspace = "."
max_steps = 8
timeout = 30.0
tool_timeout = 5.0
max_output_chars = 6000

[deepseek]
api_key = ""
base_url = "https://api.deepseek.com"
api_mode = "chat_completions"
# Set a model ID supported by your account before running Stage 1.
model = ""

[openai]
api_key = ""
base_url = "https://api.openai.com/v1"
api_mode = "responses"
# Select a GPT model that supports Responses function calling.
model = ""

[rag]
enabled = false
sources = ["local", "semantic"]
knowledge = "knowledge"
index = "knowledge/.index"
cache = ".ajagent/models"
rerank = true
device = "auto"
candidates = 10
local_path = "" # Empty uses the agent workspace; may be an external directory or file.

[tavily]
api_key = ""
timeout = 30
search_depth = "basic"
max_content_chars = 2000

[harness]
max_repairs = 2
artifact_threshold_chars = 6000
artifact_preview_chars = 1500
artifact_read_chars = 2000
artifact_max_offset = 10000000
model_log_chars = 500
tool_log_chars = 2000
validation_feedback_chars = 2000
max_tool_calls = 30
max_tokens = 100000
max_seconds = 300
deny_tools = []
validation_command = []

[limits.tools]
max_file_bytes = 1000000
max_scan_files = 1000
max_list_files = 100
max_matches = 50
excerpt_chars = 500
default_read_lines = 100
max_read_lines = 200
path_chars = 500
write_chars = 100000
diff_chars = 3000
command_output_bytes = 12000
command_chunk_bytes = 8192
command_poll_seconds = 0.1
command_max_args = 40
command_arg_chars = 2000
allowed_commands = ["python", "python3", "pytest", "rg"]
sql_rows = 50
sql_max_rows = 100
sql_query_chars = 10000
sql_value_bytes = 100000
sql_progress_steps = 1000

[limits.context]
tool_excerpt_chars = 1000
recent_groups = 2
summary_overhead_tokens = 256
estimated_bytes_per_token = 3
repeated_batches = 3

[limits.memory]
max_entries = 20
text_chars = 1000
source_chars = 300
session_buffer_bytes = 65536

[limits.retry]
attempts = 3
backoff_seconds = 0.5

[limits.retrieval]
query_chars = 2000
result_limit = 20
backend_limit = 100
default_results = 5
local_timeout = 5
rerank_candidates = 30
rrf_offset = 60
symbol_chars = 4000
rg_batch_files = 64
rg_matches_per_file = 5
chunk_chars = 1800
index_file_bytes = 10000000
index_timeout = 60
hnsw_capacity = 16
hnsw_m = 16
hnsw_construction = 200
hnsw_seed = 42
hnsw_search = 64
hnsw_search_multiplier = 4
embedding_batch = 8
embedding_tokens = 1024
reranker_batch = 4
reranker_tokens = 2048
envelope_chars = 300
web_error_chars = 1000
embedding_dimensions = 1024
