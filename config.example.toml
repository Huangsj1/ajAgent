# Copy to config.local.toml and fill in credentials locally.
# RAG is optional; Qwen retrieval models run locally.

[runtime]
provider = "deepseek"
workspace = "."
max_steps = 8
timeout = 30.0
tool_timeout = 5.0
max_output_chars = 6000

[deepseek]
api_key = ""
base_url = "https://api.deepseek.com"
api_mode = "chat_completions"
# Set a model ID supported by your account before running Stage 1.
model = ""

[openai]
api_key = ""
base_url = "https://api.openai.com/v1"
api_mode = "responses"
# Select a GPT model that supports Responses function calling.
model = ""

[rag]
enabled = false
sources = ["local", "semantic"]
knowledge = "examples/knowledge"
index = ".ajagent/rag-index"
cache = ".ajagent/models"
rerank = true
device = "auto"
candidates = 10
