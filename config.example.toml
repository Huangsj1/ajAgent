# Copy to config.local.toml and fill in credentials locally.
# Stage 2 supports both providers; embedding is reserved for Stage 3.

[runtime]
provider = "deepseek"
workspace = "."
max_steps = 8
timeout = 30.0
tool_timeout = 5.0
max_output_chars = 6000

[deepseek]
api_key = ""
base_url = "https://api.deepseek.com"
api_mode = "chat_completions"
# Set a model ID supported by your account before running Stage 1.
model = ""

[openai]
api_key = ""
base_url = "https://api.openai.com/v1"
api_mode = "responses"
# Select a GPT model that supports Responses function calling.
model = ""

[embedding]
# Stage 3 reuses the OpenAI credentials above.
provider = "openai"
model = ""
