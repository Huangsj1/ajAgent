[project]
name = "ajagent"
version = "0.1.0"
description = "Learn agent loops and harnesses step by step."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "jsonschema>=4,<5",
    "numpy>=2,<3",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-python>=0.25,<0.26",
    "tree-sitter-javascript>=0.25,<0.26",
    "tree-sitter-typescript>=0.23,<0.24",
    "hnswlib>=0.8,<0.9",
    "pypdf>=6,<7",
    "tavily-python>=0.8.5,<0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ajagent = "ajagent.cli:main"
ajagent-trace = "ajagent.harness.trace:main"
ajagent-memory = "ajagent.memory.cli:main"
ajagent-rag = "ajagent.rag.cli:main"

[project.optional-dependencies]
local-models = [
    "torch>=2.6,<3",
    "transformers>=4.51,<5",
]
browser = [
    "playwright>=1.50,<2",
]
mcp = [
    "mcp>=1.30,<2",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
cache-dir = ".uv-cache"
