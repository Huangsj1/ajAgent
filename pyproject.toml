[project]
name = "ajagent"
version = "0.1.0"
description = "Learn agent loops and harnesses step by step."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28,<0.29",
    "jsonschema>=4,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
ajagent = "ajagent.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.uv]
cache-dir = ".uv-cache"
